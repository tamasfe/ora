[package]
name = "ora-storage-sqlite"
version = "0.1.0"
edition = "2021"
publish.workspace = true

[dependencies]
async-trait.workspace = true
eyre = "0.6.12"
futures.workspace = true
ora-proto = { version = "0.1.0", path = "../ora-proto" }
ora-storage = { version = "0.1.0", path = "../ora-storage" }
parking_lot = "0.12.3"
rkyv = { version = "0.8.9", features = ["indexmap-2", "unaligned", "uuid-1"] }
rusqlite = { version = "0.32.1", features = ["bundled", "uuid"] }
sea-query = { version = "0.32.1", default-features = false, features = ["backend-sqlite", "with-uuid"] }
sea-query-rusqlite = { version = "0.7.0", features = ["with-uuid"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.134"
tokio = { version = "1.42.0", features = ["rt"] }
uuid.workspace = true

[lints]
workspace = true
