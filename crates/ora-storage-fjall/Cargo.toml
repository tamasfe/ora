[package]
name = "ora-storage-fjall"
version = "0.1.0"
edition = "2021"
publish.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait.workspace = true
bytes = "1.9.0"
eyre = "0.6.12"
fjall = { version = "2.4.4", features = ["bytes"]}
