ora-proto = { version = "0.1.1", path = "../ora-proto" }
ora-storage = { version = "0.1.0", path = "../ora-storage" }
rkyv = { version = "0.8.9", features = ["indexmap-2", "unaligned", "uuid-1"] }
serde = { version = "1.0.216", features = ["derive"] }
serde_json = "1.0.134"
tokio = { version = "1.42.0", features = ["rt"] }
tracing.workspace = true
uuid.workspace = true

[lints]
workspace = true
