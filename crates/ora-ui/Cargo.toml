[package]
name = "ora-ui"
version = "0.1.1"
edition = "2024"
publish.workspace = true
description = "Embedded web UI for the Ora scheduler."
license.workspace = true
repository.workspace = true

include = ["src/**", "dist/**", "build.rs", "Cargo.toml", "README.md"]

[dependencies]
axum = { version = "0.8.8", default-features = false, features = ["original-uri"] }
include_dir = "0.7.4"
mime_guess = "2.0.5"

[dev-dependencies]
http-body-util = "0.1.3"
tokio = { version = "1.49.0", features = ["rt", "macros"] }
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
