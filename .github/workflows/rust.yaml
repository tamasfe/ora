name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - uses: pnpm/action-setup@v6
      with:
        version: 10

    - name: UI Build
      run: cargo xtask ui build

    - name: Build
      run: cargo build

    - name: Run tests
      run: cargo test
      env:
        ORA_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
